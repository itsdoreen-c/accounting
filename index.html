<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的記帳本</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#293241;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;padding:28px 14px}.wrap{max-width:850px;margin:auto}h1{font-size:28px;margin:0 0 8px}.sub{color:#778091;margin:0 0 25px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 20px #2932410a}.card small{color:#7b8494}.card strong{display:block;font-size:25px;margin-top:10px;word-break:break-word}.green{color:#15966e}.red{color:#e16d72}.panel{margin-top:18px}h2{font-size:19px;margin:0 0 18px}.tabs{display:flex;gap:10px;margin-bottom:15px}.tabs button{flex:1;border:1px solid #dce0ea;background:white;color:#596579}.tabs button.active{background:#354d77;color:white;border-color:#354d77}button,input,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #dce0ea}button{cursor:pointer}label{display:block;font-size:13px;color:#6c7584;margin-bottom:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}input,select{width:100%;background:#ffffff;color:#293241;-webkit-text-fill-color:#293241;color-scheme:light}.primary{background:#354d77;color:white;border:0;width:100%;font-weight:700;margin-top:4px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:15px}.toolbar input{max-width:180px}.item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid #edf0f4;gap:8px}.item b{display:block}.item small{color:#8b93a0}.right{text-align:right;white-space:nowrap}.delete{border:0;background:none;color:#9aa1ac;padding:3px 0;font-size:12px}.empty{text-align:center;color:#9aa1ac;padding:28px}.foot{font-size:12px;color:#9299a6;margin:18px 0;text-align:center}@media(max-width:520px){.cards{gap:7px}.card{padding:13px}.card strong{font-size:17px}.grid{grid-template-columns:1fr}.panel{padding:16px}}input::placeholder{color:#8993a3;-webkit-text-fill-color:#8993a3}select option{background:#ffffff;color:#293241}input:focus,select:focus{outline:2px solid #91a8d1;outline-offset:1px}</style></head><body><main class="wrap"><h1>✦ 我的記帳本</h1><p class="sub">簡單記下每一筆，掌握生活收支。</p><div class="cards"><div class="card"><small>本月收入</small><strong id="income" class="green">$0</strong></div><div class="card"><small>本月支出</small><strong id="expense" class="red">$0</strong></div><div class="card"><small>本月結餘</small><strong id="balance">$0</strong></div></div><section class="panel"><h2>新增紀錄</h2><div class="tabs"><button type="button" id="expenseTab" class="active">支出</button><button type="button" id="incomeTab">收入</button></div><form id="form"><div class="grid"><div class="field"><label for="amount">金額（NT$）</label><input id="amount" type="number" min="1" step="1" required placeholder="輸入金額"></div><div class="field"><label for="category">類型</label><select id="category"></select></div><div class="field"><label for="date">日期</label><input id="date" type="date" required></div><div class="field"><label for="note">備註（選填）</label><input id="note" maxlength="100" placeholder="例如：午餐"></div></div><button class="primary" type="submit">＋ 新增記帳</button></form></section><section class="panel"><div class="toolbar"><h2 style="margin:0">收支明細</h2><input id="month" type="month" aria-label="選擇月份"></div><div id="list"></div></section><p class="foot">資料僅儲存在此瀏覽器。清除瀏覽器資料或更換裝置可能遺失紀錄。</p></main><script>const cats={expense:['餐飲','交通','購物','娛樂','居家','醫療','寵物','帳單','其他'],income:['薪資','獎金','投資','退款','禮金','其他']};let type='expense';const $=id=>document.getElementById(id);const localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('date').value=localDate();$('month').value=localDate().slice(0,7);let records=[];try{records=JSON.parse(localStorage.getItem('my-accounting-records')||'[]');if(!Array.isArray(records))records=[]}catch{records=[]}const money=n=>'$'+Number(n).toLocaleString('zh-TW');function switchType(t){type=t;$('expenseTab').classList.toggle('active',t==='expense');$('incomeTab').classList.toggle('active',t==='income');$('category').replaceChildren(...cats[t].map(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;return o}))}switchType('expense');$('expenseTab').onclick=()=>switchType('expense');$('incomeTab').onclick=()=>switchType('income');function save(){localStorage.setItem('my-accounting-records',JSON.stringify(records));render()}$('form').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0)return;records.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),type,amount,category:$('category').value,date:$('date').value,note:$('note').value.trim()});save();$('amount').value='';$('note').value='';$('amount').focus()};$('month').onchange=render;function render(){const filtered=records.filter(r=>typeof r.date==='string'&&r.date.startsWith($('month').value)).sort((a,b)=>b.date.localeCompare(a.date));const income=filtered.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount),0),expense=filtered.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount),0);$('income').textContent=money(income);$('expense').textContent=money(expense);$('balance').textContent=money(income-expense);$('balance').className=income-expense>=0?'green':'red';$('list').replaceChildren();if(!filtered.length){const d=document.createElement('div');d.className='empty';d.textContent='這個月份還沒有記帳紀錄';$('list').append(d);return}for(const r of filtered){const item=document.createElement('div');item.className='item';const left=document.createElement('div'),right=document.createElement('div');right.className='right';const title=document.createElement('b');title.textContent=r.category;const info=document.createElement('small');info.textContent=r.date+(r.note?' · '+r.note:'');left.append(title,info);const amount=document.createElement('b');amount.className=r.type==='income'?'green':'red';amount.textContent=(r.type==='income'?'+':'−')+money(r.amount);const del=document.createElement('button');del.className='delete';del.textContent='刪除';del.onclick=()=>{if(confirm('確定刪除這筆紀錄？')){records=records.filter(x=>x.id!==r.id);save()}};right.append(amount,del);item.append(left,right);$('list').append(item)}}render();</script></body></html>
